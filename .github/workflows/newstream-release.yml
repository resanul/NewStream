name: NewStream Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NewStream release APK
        run: bash gradlew assembleStableRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: newstream-v4.8.0
          name: NewStream v4.8.0
          generate_release_notes: true
          files: app/build/outputs/apk/stable/release/*.apk
