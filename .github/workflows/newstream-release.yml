name: NewStream Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NewStream release APK and Linux DEB
        run: ./gradlew assembleStableRelease :desktopApp:packageDeb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: newstream-v1.0.3
          name: NewStream v1.0.3
          generate_release_notes: true
          files: |
            app/build/outputs/apk/stable/release/*.apk
            desktopApp/build/compose/binaries/main/deb/*.deb
